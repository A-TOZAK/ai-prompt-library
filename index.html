<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI プロンプトライブラリ | 外崎のしごと道具箱</title>
  <meta name="description" content="Claude Code・Claude・Gemini・NotebookLM・ChatGPT で使うプロンプトを検索してワンクリックでコピーできるライブラリ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">🧰 AI プロンプトライブラリ</h1>
      <p class="site-subtitle">探す → コピー → 貼るだけ。毎日のAI仕事道具箱</p>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" class="search-input"
               placeholder="キーワードで検索（例：授業 / 占い / アンケート / note）"
               autocomplete="off" autofocus>
        <button id="clearSearch" class="clear-search" title="検索をクリア" hidden>✕</button>
      </div>
    </div>
  </header>

  <nav class="filters container">
    <div class="collection-toggle" id="collectionToggle" role="tablist" aria-label="コレクション切替">
      <button class="seg active" data-collection="work">🧰 しごと・AI活用</button>
      <button class="seg" data-collection="school">🏫 授業・教科（小中高）</button>
    </div>
    <div class="filter-group" id="toolTabs" role="tablist" aria-label="ツール・校種で絞り込み"></div>
    <div class="filter-group" id="categoryChips" aria-label="カテゴリで絞り込み"></div>
    <p class="result-count" id="resultCount"></p>
  </nav>

  <main class="container">
    <div id="cardGrid" class="card-grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p>😢 見つかりませんでした</p>
      <p class="empty-hint">キーワードを短くするか、フィルタを「すべて」に戻してみてください</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>✍️ プロンプトの追加は <code>js/prompts-data.js</code> を編集（Claude Code に「プロンプトライブラリに追加して」でもOK）</p>
      <p>© 外崎顕博 / LiFE with — <a href="https://github.com/A-TOZAK/ai-prompt-library" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 編集パネル -->
  <div id="editPanel" class="edit-panel" role="dialog" aria-modal="true" aria-label="プロンプト編集">
    <div class="edit-panel-header">
      <span class="edit-panel-title">✏️ プロンプトを編集して使う</span>
      <button id="editPanelClose" class="edit-panel-close" title="閉じる">✕</button>
    </div>
    <div class="edit-panel-body">
      <textarea id="editTextarea" class="edit-textarea" placeholder="ここでプロンプトを自由に書き換えられます。[　] 内のプレースホルダーを自分の内容に置き換えてみてください。" spellcheck="false"></textarea>
      <p class="edit-hint">コピーして開きたいAIを選んでください。クリップボードに内容をコピーしてから新しいタブで開きます。</p>
      <div class="ai-buttons">
        <button class="ai-btn ai-btn-claude"       data-url="https://claude.ai/new"               data-name="Claude">🟠 Claude</button>
        <button class="ai-btn ai-btn-chatgpt"      data-url="https://chatgpt.com"                 data-name="ChatGPT">🤖 ChatGPT</button>
        <button class="ai-btn ai-btn-gemini"       data-url="https://gemini.google.com"           data-name="Gemini">✨ Gemini</button>
        <button class="ai-btn ai-btn-notebooklm"   data-url="https://notebooklm.google.com"       data-name="NotebookLM">📓 NotebookLM</button>
      </div>
    </div>
  </div>
  <div id="editOverlay" class="edit-overlay"></div>

  <script src="js/prompts-data.js"></script>
  <script src="js/school-prompts-1.js"></script>
  <script src="js/school-prompts-2.js"></script>
  <script src="js/school-prompts-3.js"></script>
  <script src="js/school-prompts-4.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
